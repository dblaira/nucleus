name: iOS composer
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths: ['ios/**', '.github/workflows/ios-composer.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-composer.yml']
permissions:
  contents: read
jobs:
  build-and-regressions:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compiler and SDK versions
        run: |
          xcodebuild -version
          xcrun swiftc --version
          xcodebuild -showsdks
      - name: Composer regressions
        run: bash ios/tests/run-composer-tests.sh
      - name: Build complete simulator app
        run: >-
          xcodebuild -project ios/nucleus.xcodeproj -scheme nucleus
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/nucleus-simulator"
          CODE_SIGNING_ALLOWED=NO build
      - name: Build complete device app without signing
        run: >-
          xcodebuild -project ios/nucleus.xcodeproj -scheme nucleus
          -configuration Debug -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/nucleus-device"
          CODE_SIGNING_ALLOWED=NO build
