name: CowboyAITrial
options:
  bundleIdPrefix: com.adamblair
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7FKUS5M5QS

targets:
  SAVY:
    type: application
    platform: iOS
    configFiles:
      Debug: SAVY.xcconfig
      Release: SAVY.xcconfig
    sources:
      - path: SAVY
        excludes:
          - AuthGateView.swift
          - AuthenticationStore.swift
          - AmplifyAuthService.swift
    resources:
      - path: SAVY/amplifyconfiguration.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamblair.cowboyai.savytrial
        PRODUCT_NAME: CowboyAITrial
        PRODUCT_MODULE_NAME: SAVY
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        CODE_SIGN_ENTITLEMENTS: SAVY/SAVY.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7FKUS5M5QS
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SAVY/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": SAVY/SAVY-Mac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_DEBUG_DYLIB: NO
  SAVYTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SAVYTests
    dependencies:
      - target: SAVY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.adamblair.cowboyai.savytrial.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CowboyAITrial.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CowboyAITrial"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SAVYUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SAVYUITests
    dependencies:
      - target: SAVY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.adamblair.cowboyai.savytrial.uitests
        TEST_TARGET_NAME: SAVY

schemes:
  CowboyAITrial:
    build:
      targets:
        SAVY: all
        SAVYTests: [test]
        SAVYUITests: [test]
    run:
      config: Debug
      debugEnabled: false
    test:
      config: Debug
      debugEnabled: false
      targets:
        - SAVYTests
        - SAVYUITests
