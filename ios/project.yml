name: nucleus
options:
  bundleIdPrefix: com.adamblair
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 7FKUS5M5QS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  nucleus:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources: [nucleus]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamblair.nucleus
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: nucleus/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal

  nucleusTests:
    type: bundle.unit-test
    platform: iOS
    sources: [nucleusTests]
    dependencies:
      - target: nucleus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  nucleusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [nucleusUITests]
    dependencies:
      - target: nucleus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  nucleus:
    build:
      targets:
        nucleus: all
        nucleusTests: [test]
        nucleusUITests: [test]
    test:
      targets:
        - nucleusTests
        - nucleusUITests
      environmentVariables:
        COWBOYAI_UI_TEST: "1"
